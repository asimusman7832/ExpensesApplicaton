<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header bg-primary opacity-75">
                    <h3 class="card-title mb-0 text-white">Sign Up</h3>
                </div>
                <div class="card-body">

                    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                        {{ errorMessage }}
                    </div>

                    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            [ngClass]="{'is-invalid': hasError('email', 'required') || hasError('email', 'email')}"
                            formControlName="email">

                            <div class="invalid-feedback" *ngIf="hasError('email', 'required')">
                                Email address is required.
                            </div>
                            <div class="invalid-feedback" *ngIf="hasError('email', 'email')">
                                Please enter a valid email address.
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            [ngClass]="{'is-invalid': hasError('password', 'required') || hasError('password', 'minlength')}"
                            formControlName="password">

                            <div class="invalid-feedback" *ngIf="hasError('password', 'required')">
                                Password is required.
                            </div>
                            <div class="invalid-feedback" *ngIf="hasError('password', 'minlength')">
                                Password must be at least 6 characters long.
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input 
                            type="password" 
                            class="form-control" 
                            id="confirmPassword" 
                            [ngClass]="{'is-invalid': hasError('confirmPassword', 'required') || (signupForm.hasError('passwordMismatch') &&
                                 signupForm.get('confirmPassword')?.touched)}"
                            formControlName="confirmPassword">

                            <div class="invalid-feedback" *ngIf="hasError('confirmPassword', 'required')">
                                Confirm Password is required.
                            </div>
                            <div class="invalid-feedback"  *ngIf="signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched">
                                Passwords do not match.
                            </div>

                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" [disabled]="!signupForm.valid">Sign Up</button>
                        </div>

                        <div class="text-center mt-3">
                            Already have an account? <a [routerLink]="'/login'">Login</a>

                        </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>
